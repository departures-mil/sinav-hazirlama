<!doctype html>
<html lang="tr" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<title>Sınav Hazırlama Sistemi</title>
<script>/* görünüm ve dil ilk boyamadan önce (yanıp sönmesin) */try{var g=function(k){try{return JSON.parse(localStorage.getItem('fc.'+k))}catch(e){return null}},d=document.documentElement,th=g('theme'),sc=g('scheme'),l=g('lang');if(!l){try{l=(JSON.parse(localStorage.getItem('prefs')||'{}')||{}).uiLang}catch(e){}}d.setAttribute('data-scheme',sc||'falcon');if(th==='light'||(th==='auto'&&matchMedia('(prefers-color-scheme: light)').matches))d.classList.add('theme-light');if(l){d.lang=l;d.dir=l==='ar'?'rtl':'ltr'}}catch(e){}</script>
<link rel="stylesheet" href="cekirdek/css/tokens.css">
<link rel="stylesheet" href="cekirdek/css/core.css">
<link rel="stylesheet" href="styles.css">
<script src="cekirdek/fc-core.js"></script>
<script src="surum.js"></script>
</head>
<body>
<header class="topbar">
  <div class="brand"><span class="logo"><img src="../assets/icon.png" alt=""></span><div><div class="appname"><span data-i18n="appTitle"></span> <span class="ver" id="appVer"></span></div><div class="filename" id="fileName"></div></div></div>
  <div class="group g1">
    <button id="btnNew" class="tb" data-i18n-title="new"><span class="ic">＋</span><span class="lbl" data-i18n="new"></span></button>
    <button id="btnOpen" class="tb" data-i18n-title="open"><span class="ic">📂</span><span class="lbl" data-i18n="open"></span></button>
    <span class="split">
      <button id="btnSave" class="tb" data-i18n-title="save"><span class="ic">💾</span><span class="lbl" data-i18n="save"></span></button>
      <button id="btnSaveMore" class="tb caret" data-i18n-title="saveMore">▾</button>
      <div class="menu" id="saveMenu"><button id="btnSaveAs" data-i18n="saveAs"></button></div>
    </span>
  </div>
  <div class="group g1">
    <button id="btnImport" class="tb" data-i18n-title="import"><span class="ic">📥</span><span class="lbl" data-i18n="importShort"></span></button>
    <button id="btnTemplate" class="tb" data-i18n-title="template"><span class="ic">🖼</span><span class="lbl" data-i18n="templateShort"></span></button>
    <button id="btnTranslateAll" class="tb" data-i18n-title="translateAll"><span class="ic">🌐</span><span class="lbl" data-i18n="translateShort"></span></button>
  </div>
  <button id="btnOutput" class="tb primary" data-i18n-title="output"><span class="ic">🖨</span><span class="lbl" data-i18n="output"></span></button>
  <div class="group g1">
    <button id="btnAdvisor" class="tb" data-i18n-title="advisor"><span class="ic">🤖</span><span class="lbl" data-i18n="advisor"></span></button>
    <button id="btnSettings" class="tb" data-i18n-title="settings"><span class="ic">⚙</span><span class="lbl" data-i18n="settings"></span></button>
  </div>
  <button id="btnCloud" class="tb cloudbtn" data-st="off" data-i18n-title="cloud"><span class="ic">☁</span><span class="lbl" data-i18n="cloud"></span><i class="dot"></i></button>
  <div class="group end">
    <label class="sel" data-i18n-title="contentLang"><span data-i18n="contentLangShort"></span><select id="contentLang"></select></label>
    <span class="vsep"></span>
    <button id="btnFind" class="tb icon" data-i18n-title="findTip">🔍</button>
    <button id="btnSearchAll" class="tb icon" data-i18n-title="srTitle">🔎</button>
    <button id="btnUndo" class="tb icon" data-i18n-title="undo">↶</button>
    <span class="vsep"></span>
  </div>
  <!-- sağ üst: Eşitle · Wi-Fi · Güncelle · tema · dil | Küçült · Orta · Tam ekran · Kapat (ortak çekirdek, kabuk.js) -->
</header>

<div class="main">
  <aside class="side">
    <div class="stats" id="stats"></div>
    <div class="navgrid" id="navGrid"></div>
    <div class="sidetools">
      <div class="sidehead" data-i18n="tools"></div>
      <label class="sb sbsel">🎯 <span data-i18n="filterLbl"></span> <select id="qFilter"></select></label>
      <button id="btnSelVis" class="sb" data-i18n="selectVisible"></button>
      <button id="btnSelAll" class="sb" data-i18n="selectAll"></button>
      <button id="btnSelNone" class="sb" data-i18n="selectNone"></button>
      <label class="sb sbsel">🏷 <span data-i18n="tagAssign"></span> <select id="tagSel"></select></label>
      <button id="btnGhostSel" class="sb" data-i18n="ghostSel"></button>
      <button id="btnDelSel" class="sb danger" data-i18n="deleteSelected"></button>
      <button id="btnShuffleQ" class="sb" data-i18n="shuffleQuestions"></button>
      <button id="btnShuffleO" class="sb" data-i18n="shuffleAllOptions"></button>
      <button id="btnTrSel" class="sb">🌐 <span data-i18n="bulkTr"></span></button>
    </div>
  </aside>

  <main class="editor" id="editor">
    <section class="card examinfo" id="examInfo">
      <h3 data-i18n="examInfo"></h3>
      <div class="grid2">
        <label><span data-i18n="school"></span><input id="fSchool" type="text" dir="auto"></label>
        <label><span data-i18n="examTitle"></span><input id="fTitle" type="text" dir="auto" data-i18n-ph="examTitlePh"></label>
      </div>
      <label><span data-i18n="instructions"></span><textarea id="fInstr" rows="2" dir="auto" data-i18n-ph="instructionsPh"></textarea></label>
    </section>

    <section class="card settingsInline" id="settingsCard"></section>

    <nav class="tabs">
      <button data-tab="test">📝 <span data-i18n="tabTest"></span> <em id="cntTest"></em></button>
      <button data-tab="scen">📖 <span data-i18n="tabScen"></span> <em id="cntScen"></em></button>
      <button data-tab="vocab">🔤 <span data-i18n="tabVocab"></span> <em id="cntVocab"></em></button>
    </nav>

    <div id="testPane">
      <div class="row autobar top"><button class="btn primary" id="btnAutoQTop" data-i18n="autoQ"></button><button class="btn" id="btnArchQTop" data-i18n="archiveQ"></button><button class="btn" id="btnAiQTop" data-i18n="aiQ"></button></div>
      <div class="filterbar" id="filterBar" style="display:none"><span id="filterInfo"></span><button class="btn" id="btnFilterOff" data-i18n="filterOff"></button></div>
      <div id="qList"></div>
      <div class="empty" id="emptyMsg" data-i18n="emptyList"></div>
      <button class="addq" id="btnAddQ" data-i18n="addQuestion"></button>
      <div class="row autobar"><button class="btn primary" id="btnAutoQ" data-i18n="autoQ"></button><button class="btn" id="btnArchQ" data-i18n="archiveQ"></button></div>

      <section class="card keypanel" id="keyPanel">
        <h3>🔑 <span data-i18n="answerKey"></span></h3>
        <p class="hint" data-i18n="answerKeyHint"></p>
        <div class="keygrid" id="keyGrid"></div>
      </section>
    </div>

    <div id="scenPane">
      <div class="tplbar"><span id="scenTplInfo"></span><button class="btn" id="btnScenTpl">🖼 <span data-i18n="template"></span></button></div>
      <div id="sList"></div>
      <div class="empty" id="scenEmpty" data-i18n="scenEmpty"></div>
      <button class="addq" id="btnAddScen" data-i18n="addScenario"></button>
      <div class="row autobar"><button class="btn primary" id="btnAutoS" data-i18n="autoS"></button><button class="btn" id="btnArchS" data-i18n="archiveS"></button></div>
      <section class="card">
        <label class="notelbl"><span data-i18n="scenNote"></span><textarea id="fScenNote" rows="2"></textarea></label>
      </section>
      <section class="card keypanel" id="scenSummary">
        <h3>🔑 <span data-i18n="scenSummary"></span></h3>
        <p class="hint" data-i18n="scenSummaryHint"></p>
        <div id="scenSummaryTable"></div>
      </section>
    </div>

    <div id="vocabPane">
      <section class="card vocab">
        <div class="grid2">
          <label><span data-i18n="vocabSection"></span><input id="fVocabTitle" type="text"></label>
          <label><span data-i18n="vocabPtsLabel"></span><input id="fVocabPts" type="number" min="0" step="0.5" style="max-width:140px"></label>
        </div>
        <p class="hint" data-i18n="vocabHint"></p>
        <div class="row vbar">
          <button class="btn primary" id="btnVocabImport" data-i18n="vocabImport"></button>
          <button class="btn" id="btnVocabCheck" data-i18n="vocabCheck"></button>
          <button class="btn" id="btnVocabDedupe" data-i18n="vocabDedupe"></button>
          <button class="btn" id="btnVocabAllOn" data-i18n="vocabAllOn"></button>
          <button class="btn" id="btnVocabAllOff" data-i18n="vocabAllOff"></button>
          <button class="btn" id="btnVocabFill" style="display:none"></button>
          <span class="vactive" id="vocabActive"></span>
        </div>
        <div class="row vcolbar">
          <b data-i18n="vocabCols"></b>
          <span class="vcol"><b class="fixed">EN</b> <span data-i18n="vocabColEn"></span></span>
          <label class="vcol"><span class="sw"><input type="checkbox" id="vcAr"><span></span></span> <span data-i18n="vocabColAr"></span></label>
          <label class="vcol"><span class="sw"><input type="checkbox" id="vcTr"><span></span></span> <span data-i18n="vocabColTr"></span></label>
          <span class="hint" data-i18n="vocabColsHint"></span>
        </div>
        <div class="row vlvlbar" id="vocabLevels"></div>
        <div id="vocabWarn" class="vwarn"></div>
        <table class="vtable">
          <thead><tr id="vocabHead"></tr></thead>
          <tbody id="vocabRows"></tbody>
        </table>
        <div class="empty" id="vocabEmpty" data-i18n="vocabEmpty"></div>
        <div class="row" style="margin-top:10px">
          <button class="btn primary" id="btnAddVocab" data-i18n="addVocab"></button>
          <button class="btn" id="btnAddVocab10" data-i18n="addVocab10"></button>
        </div>
      </section>
    </div>
  </main>
</div>

<div id="modalRoot"></div>
<div id="toasts"></div>

<script src="i18n.js"></script>
<script src="parser.js"></script>
<script src="scenario-parser.js"></script>
<script src="vocab-tools.js"></script>
<script src="c2-words.js"></script>
<script src="oxford-words.js"></script>
<script src="aviation-words.js"></script>
<script src="sozluk.js"></script>
<script src="bank-data.js"></script>
<script src="bank-data2.js"></script>
<script src="bank-gen.js"></script>
<script src="cekirdek/fc-yerel-zeka-ui.js"></script>
<script src="ceviri.js"></script>
<script src="ai.js"></script>
<script src="bank.js"></script>
<script src="doc-scan.js"></script>
<script src="spell.js"></script>
<script src="render.js"></script>
<script src="cloud.js"></script>
<script src="kabuk.js"></script>
<script src="omr.js"></script>
<script src="ek-temel.js"></script>
<script src="ek-gorsel.js"></script>
<script src="ek-araclar.js"></script>
<script src="ek-sinif.js"></script>
<script src="ek-plus.js"></script>
<script type="module" src="app.js"></script>
</body>
</html>
