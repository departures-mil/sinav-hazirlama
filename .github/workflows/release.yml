# Sınav Hazırlama — test → Windows derlemesi (NSIS kurulum + app.asar) → GitHub Release (ortak çekirdek, delta yamalar).
# Yayın (1.10.4+): package.json sürümünü değiştirin (node tools/surum.js X.Y.Z) ve main'e gönderin — o sürümün
# GitHub Release'i yoksa yayın KENDİLİĞİNDEN başlar (elle Run workflow gerekmez). Yedek yollar: Actions → release →
# "Run workflow" (main) ya da `git tag vX.Y.Z && git push --tags`. Etiket v<package.json sürümü> olur.
# Entegrasyon dallarında (ortak-cekirdek-*) yalnız test + derleme çalışır. Testler geçmezse derleme ve yayın olmaz.
name: release
on:
  push:
    tags: ['v*']
    branches: ['ortak-cekirdek-*', 'main']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # main'e gönderimde: bu sürümün yayını zaten varsa hiçbir şey yapılmaz (aynı sürüm iki kez yayınlanmaz)
  gate:
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.g.outputs.go }}
    steps:
      - uses: actions/checkout@v4
      - id: g
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="$(node -p "require('./package.json').version")"
          if [ "${GITHUB_REF}" = "refs/heads/main" ] && [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            if gh release view "v$v" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then echo "v$v zaten yayında; atlanıyor"; echo "go=false" >> "$GITHUB_OUTPUT"; else echo "v$v yayında değil; yayınlanacak"; echo "go=true" >> "$GITHUB_OUTPUT"; fi
          else
            echo "go=true" >> "$GITHUB_OUTPUT"
          fi

  test:
    needs: gate
    if: needs.gate.outputs.go == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Electron için sistem kitaplıkları
        run: sudo apt-get update -q && sudo apt-get install -y -q xvfb libnss3 libgbm1 libasound2t64 libgtk-3-0 >/dev/null || sudo apt-get install -y -q xvfb libnss3 libgbm1 libgtk-3-0
      - name: npm test (duman testi + Wi-Fi eşitleme testi + Electron açılış testi, xvfb)
        run: npm test
      - name: Etiket = package.json sürümü
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          v="$(node -p "require('./package.json').version")"
          [ "v$v" = "${GITHUB_REF_NAME}" ] || { echo "::error::etiket ${GITHUB_REF_NAME} ≠ package.json v$v"; exit 1; }

  build:
    needs: [gate, test]
    if: needs.gate.outputs.go == 'true'
    runs-on: windows-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - id: ver
        shell: bash
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - name: NSIS kurulum + app.asar (imzasız; exe simgesi build/icon.ico)
        run: npx electron-builder --win nsis --x64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Yayınlanacak dosyaları topla
        shell: bash
        run: |
          set -euo pipefail
          mkdir release
          cp dist/win-unpacked/resources/app.asar release/app.asar
          cp dist/*Setup*.exe release/
          ls -la release
          sha256sum release/*
      - uses: actions/upload-artifact@v4
        with:
          name: release-win
          path: release/
          retention-days: 5

  release:
    needs: [gate, test, build]
    if: needs.gate.outputs.go == 'true' && (startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main')
    permissions:
      contents: write
    uses: departures-mil/ortak-cekirdek/.github/workflows/reusable-release.yml@main
    with:
      app_id: sinav-hazirlama
      version: ${{ needs.build.outputs.version }}
      file_prefix: SinavHazirlama
      release_title: Sınav Hazırlama v${{ needs.build.outputs.version }}
      min_version: 1.10.2
      files: |
        win-app=app.asar
        win-setup=*Setup*.exe
      notes_json: release-notes.json
      core_ref: main
